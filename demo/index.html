<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sports Player" />
    <meta name="theme-color" content="#000000" />
    <meta name="format-detection" content="telephone=no" />
    <title>Sports Video Player デモ</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        background: #0f0f0f;
        color: #eee;
        font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 32px env(safe-area-inset-left, 0px);
      }
      h1 {
        font-size: 18px;
        margin: 16px;
      }
      sports-video-player {
        border-radius: 0;
      }
      @media (min-width: 700px) {
        sports-video-player {
          border-radius: 12px;
        }
      }
      section {
        margin: 16px;
        font-size: 13px;
        line-height: 1.7;
        color: #bbb;
      }
      #log {
        margin: 0;
        padding: 10px;
        height: 160px;
        overflow: auto;
        background: #181818;
        border-radius: 8px;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
      }
    </style>
    <script type="module" src="../src/index.ts"></script>
  </head>
  <body>
    <main>
      <h1>Sports Video Player</h1>
      <sports-video-player id="player" file-picker></sports-video-player>

      <section>
        <pre id="log" aria-label="イベントログ"></pre>
      </section>
    </main>

    <script type="module">
      const player = document.getElementById('player');
      const log = document.getElementById('log');
      const write = (type, detail) => {
        const t = new Date().toLocaleTimeString();
        log.textContent = `${t} ${type} ${JSON.stringify(detail)}\n` + log.textContent;
      };
      for (const type of ['svp-load', 'svp-skip', 'svp-ratechange', 'svp-playstate', 'svp-error']) {
        player.addEventListener(type, (e) => write(type, e.detail));
      }
      // 動作確認用：?src=/testdata/xxx.MOV で開発サーバー上の動画を読み込む
      const src = new URLSearchParams(location.search).get('src');
      if (src) player.setAttribute('src', src);
    </script>
  </body>
</html>
